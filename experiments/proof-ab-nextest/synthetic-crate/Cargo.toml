[workspace]

[package]
name = "audiobook-boss-synthetic"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "audiobook_boss_lib"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "audiobook-boss"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
