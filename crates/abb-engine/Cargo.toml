[package]
name = "abb-engine"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# Developer tool: drives the working session from a terminal (see `src/bin/abb_dev.rs`).
[[bin]]
name = "abb-dev"
path = "src/bin/abb_dev.rs"

[lib]
# ABB treats backend contract coverage as unit/integration tests plus IPC and
# boundary checks; rustdoc examples are not a supported test surface today.
doctest = false

[dependencies]
abb-audible-core = { path = "../abb-audible-core" }
abb-media-core = { path = "../abb-media-core" }
abb-metadata-core = { path = "../abb-metadata-core" }
abb-output-artifact-core = { path = "../abb-output-artifact-core" }
abb-processing-core = { path = "../abb-processing-core" }
abb-remote-source-core = { path = "../abb-remote-source-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.4"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.23.1", features = ["v4"] }
log = "0.4.29"
ffmpeg-next = "9.0.0"
ffmpeg-sys-next = { version = "9.0.0", default-features = false }
faac-sys = { path = "../../vendor/faac-sys" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# One reqwest with http2: each server picks HTTP/2 or HTTP/1.1. HTTP/3 needs the
# `reqwest_unstable` cfg and has no fallback (upstream #2303), so ABB leaves it off.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "stream", "json", "query", "form"] }
# audible_api currently accepts reqwest 0.12 request values. Keep this renamed
# dependency private to the Audible provider until that upstream surface changes.
audible-reqwest = { package = "reqwest", version = "0.12.28", features = ["json"] }
mp4ameta = "0.13.0"
bogon = "0.3"
# Typed URL hosts for the cover-fetch SSRF policy; same version reqwest resolves.
url = "2.5.8"
# Decodes cover request paths; the version url already resolves.
percent-encoding = "2.3.2"
# Exact pins: a prerelease family whose generated TS contract can change between
# RCs. Bump together with the host crate, deliberately, and regenerate bindings.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
keyring-core = "1.0.0"
secrecy = "0.10.3"
sha2 = "0.11.0"
audible_api = "0.1.0"

# Platform-native OS credential stores, registered directly through keyring-core
# (see remote_source/vault.rs). Replaces the `keyring` umbrella crate, whose
# unconditional `db-keystore` backend dragged in turso + tantivy + memmap2 (a
# SQLite rewrite and a full-text search engine) that ABB never used — it only
# ever selects the native OS keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

# macOS power assertion; Linux logind idle inhibitor over D-Bus.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keepawake = "0.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service when the session bus answers; keyutils only until restart.
# zbus is already linked (keepawake). See remote_source/vault.rs.
linux-keyutils-keyring-store = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[features]
default = []
bundled-ffmpeg = [
    "ffmpeg-next/build",
    "ffmpeg-sys-next/build-audiotoolbox",
    "ffmpeg-sys-next/build-lib-opus",
    "ffmpeg-sys-next/build-portable",
]

[dev-dependencies]
tempfile = "3.27.0"
base64 = "0.23.1"
# Test-time AAX/AAXC encryptor for the decrypt lane (same crates as audible-core).
aes = "0.9.3"
cbc = "0.2.1"
sha1 = "0.10.6"
# Media-lane fixture synthesis (e.g. MP3 via libmp3lame). Same version as the
# main dependency, so this adds zero extra compilation.
ffmpeg-next = "9.0.0"
# Local TLS stub for the Audible download harness (no real Audible account).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }
proptest = "1.11.0"
# Paused time for tests of delayed work.
tokio = { version = "1.52.1", features = ["full", "test-util"] }

[lints]
workspace = true
