[package]
name = "abb-engine"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[[bin]]
name = "abb-dev"
path = "src/bin/abb_dev.rs"

[lib]
doctest = false

[dependencies]
abb-audible-core = { path = "../abb-audible-core" }
abb-media-core = { path = "../abb-media-core" }
abb-media-pipeline = { path = "../abb-media-pipeline" }
abb-metadata-core = { path = "../abb-metadata-core" }
abb-output-artifact-core = { path = "../abb-output-artifact-core" }
abb-processing-core = { path = "../abb-processing-core" }
abb-remote-source-core = { path = "../abb-remote-source-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
uuid = { version = "1.28.0", features = ["v4"] }
log = "0.4.29"
abb-ffmpeg = { path = "../abb-ffmpeg" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "stream", "json", "query", "form"] }
bogon = "0.3"
url = "2.5.8"
percent-encoding = "2.3.2"
specta.workspace = true
specta-typescript.workspace = true
keyring-core = "1.0.1"
secrecy = "0.10.3"
sha2 = "0.11.1"
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["aws-lc-sys"] }
rustls-pki-types = "1.15.1"
base64 = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[features]
default = []
bundled-ffmpeg = ["abb-media-pipeline/bundled-ffmpeg", "abb-ffmpeg/bundled-ffmpeg"]

[dev-dependencies]
abb-test-fixtures = { path = "../abb-test-fixtures" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
mp4ameta = "0.13.0"
tempfile = "3.27.0"
aes = "0.9.3"
cbc = "0.2.1"
sha1 = "0.11.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
proptest = "1.12.0"
tokio = { version = "1.53.3", features = ["test-util"] }

[lints]
workspace = true
