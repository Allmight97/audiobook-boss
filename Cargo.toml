[workspace]
members = [
    "crates/abb-audible-core",
    "crates/abb-engine",
    "crates/abb-media-core",
    "crates/abb-metadata-core",
    "crates/abb-output-artifact-core",
    "crates/abb-processing-core",
    "crates/abb-remote-source-core",
    "vendor/faac-sys",
    "src-tauri",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

# Deterministic lint posture shared by every workspace member (members opt in with
# `[lints] workspace = true`). Warn-level keeps the surface explicit without gating
# on src-tauri's GUI-toolkit build, which not every environment can compile.
# CI runs Clippy for the core crates, the engine, and the host (`scripts/verify.sh`).
# Workspace-wide Clippy needs --features audiobook-boss/bundled-ffmpeg,abb-engine/bundled-ffmpeg.
[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
too_many_lines = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_methods = "warn"

[patch.crates-io]
ffmpeg-next = { path = "vendor/ffmpeg-next-9.0.0" }
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next-9.0.0" }

# Image codecs run optimized in dev and test builds, so cover loading there
# shows release speed; unoptimized decoding is many times slower.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
