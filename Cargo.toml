[workspace]
members = [
    "crates/abb-audible-core",
    "crates/abb-media-core",
    "crates/abb-metadata-core",
    "crates/abb-output-artifact-core",
    "crates/abb-processing-core",
    "crates/abb-remote-source-core",
    "src-tauri",
    "vendor/faac-sys",
]
resolver = "2"

# Deterministic lint posture shared by every workspace member (members opt in with
# `[lints] workspace = true`). Warn-level keeps the surface explicit without gating
# on src-tauri's GUI-toolkit build, which not every environment can compile.
# Clippy is a local owner check; commands and scope live in scripts/AGENTS.md.
[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
ffmpeg-next = { path = "vendor/ffmpeg-next-9.0.0" }
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next-9.0.0" }
