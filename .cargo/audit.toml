[advisories]
ignore = [
  # GTK3 stack from tauri -> tauri-runtime-wry -> wry -> webkit2gtk/gtk (Linux path).
  # Acceptance: warnings are unmaintained/unsound only; no direct top-level alternative until tauri/wry migrate.
  "RUSTSEC-2024-0411", # gdkwayland-sys
  "RUSTSEC-2024-0412", # gdk
  "RUSTSEC-2024-0413", # atk
  "RUSTSEC-2024-0414", # gdkx11-sys
  "RUSTSEC-2024-0415", # gtk
  "RUSTSEC-2024-0416", # atk-sys
  "RUSTSEC-2024-0417", # gdkx11
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0420", # gtk-sys
  "RUSTSEC-2024-0429", # glib

  # Proc-macro chain via gtk3-macros/glib-macros and specta.
  # Acceptance: compile-time only (not shipped at runtime); waiting on upstream crate replacements.
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2024-0436", # paste

  # zbus 5 chain (zvariant, zbus_names, zvariant_derive) via keepawake,
  # secret-service, and zbus-secret-service-keyring-store (Linux path).
  # Acceptance: unmaintained only, successor is zbus 6. Blocked upstream until
  # keepawake, secret-service and the keyring store move to zbus 6; dropping
  # the keyring store would lose saved Audible sign-ins on every restart.
  "RUSTSEC-2026-0370", # zvariant
  "RUSTSEC-2026-0371", # zbus_names
  "RUSTSEC-2026-0372", # zvariant_derive
]
informational_warnings = ["unmaintained", "unsound"]
