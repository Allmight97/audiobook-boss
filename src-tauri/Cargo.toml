[package]
name = "audiobook-boss"
version = "1.1.3"
description = "AudioBook Boss™ — Batch audiobook processing and metadata management"
authors = ["JStar"]
edition = "2021"
default-run = "audiobook-boss"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiobook_boss_lib"
# Tauri packaging needs these crate types. Use one package/target-selected
# Nextest command at a time for Rust review instead of changing packaging
# artifacts to influence test discovery.
crate-type = ["staticlib", "cdylib", "rlib"]
# ABB treats backend contract coverage as unit/integration tests plus IPC and
# boundary checks; rustdoc examples are not a supported test surface today.
doctest = false

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
abb-audible-core = { path = "../crates/abb-audible-core" }
abb-media-core = { path = "../crates/abb-media-core" }
abb-metadata-core = { path = "../crates/abb-metadata-core" }
abb-output-artifact-core = { path = "../crates/abb-output-artifact-core" }
abb-processing-core = { path = "../crates/abb-processing-core" }
abb-remote-source-core = { path = "../crates/abb-remote-source-core" }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
uuid = { version = "1.23.1", features = ["v4"] }
log = "0.4.29"
env_logger = "0.11.10"
num_cpus = "1.17.0"
ffmpeg-next = "8.1.0"
ffmpeg-sys-next = { version = "8.1.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "query", "form"] }
# audible_api currently accepts reqwest 0.12 request values. Keep this renamed
# dependency private to the Audible provider until that upstream surface changes.
audible-reqwest = { package = "reqwest", version = "0.12.28", features = ["json"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
mp4ameta = "0.13.0"
bogon = "0.3"
specta = "=2.0.0-rc.24"
specta-typescript = "=0.0.11"
tauri-specta = { version = "=2.0.0-rc.24", features = ["typescript"] }
urlencoding = "2.1.3"
keyring = "4.0.1"
keyring-core = "1.0.0"
secrecy = "0.10.3"
sha2 = "0.10.9"
zeroize = "1.8.2"
audible_api = "0.1.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Default features - now minimal with only essential Tauri features
default = []
bundled-ffmpeg = ["ffmpeg-next/build", "ffmpeg-sys-next/build-audiotoolbox"]

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.11.2", features = ["test"] }
futures = "0.3.32"
base64 = "0.22.1"
