[package]
name = "audiobook-boss"
version = "1.18.4"
description = "AudioBook Boss™ — Batch audiobook processing and metadata management"
authors = ["JStar"]
edition = "2021"
license.workspace = true
default-run = "audiobook-boss"
autobins = false

[[bin]]
name = "audiobook-boss"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["binding-export"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiobook_boss_lib"
crate-type = ["cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
abb-engine = { path = "../crates/abb-engine" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
log = "0.4.29"
env_logger = "0.11.10"
tokio = { version = "1.53.3", features = ["sync", "time"] }
specta.workspace = true
specta-typescript.workspace = true
tauri-specta = { workspace = true, features = ["typescript"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

default = []
binding-export = ["dep:serde_json"]
bundled-ffmpeg = ["abb-engine/bundled-ffmpeg"]

[lints]
workspace = true
