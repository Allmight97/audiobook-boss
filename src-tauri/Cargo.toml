[package]
name = "audiobook-boss"
version = "1.4.0"
description = "AudioBook Boss™ — Batch audiobook processing and metadata management"
authors = ["JStar"]
edition = "2021"
default-run = "audiobook-boss"
autobins = false

[[bin]]
name = "audiobook-boss"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["binding-export"]

[[bin]]
name = "verify_aac_decoder_contract"
path = "src/bin/verify_aac_decoder_contract.rs"
required-features = ["decoder-contract"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiobook_boss_lib"
# Tauri packaging needs these crate types. Use one package/target-selected
# Nextest command at a time for Rust review instead of changing packaging
# artifacts to influence test discovery.
crate-type = ["staticlib", "cdylib", "rlib"]
# ABB treats backend contract coverage as unit/integration tests plus IPC and
# boundary checks; rustdoc examples are not a supported test surface today.
doctest = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
abb-audible-core = { path = "../crates/abb-audible-core" }
abb-media-core = { path = "../crates/abb-media-core" }
abb-metadata-core = { path = "../crates/abb-metadata-core" }
abb-output-artifact-core = { path = "../crates/abb-output-artifact-core" }
abb-processing-core = { path = "../crates/abb-processing-core" }
abb-remote-source-core = { path = "../crates/abb-remote-source-core" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
log = "0.4.29"
env_logger = "0.11.10"
ffmpeg-next = "9.0.0"
ffmpeg-sys-next = { version = "9.0.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "query", "form"] }
# audible_api currently accepts reqwest 0.12 request values. Keep this renamed
# dependency private to the Audible provider until that upstream surface changes.
audible-reqwest = { package = "reqwest", version = "0.12.28", features = ["json"] }
mp4ameta = "0.13.0"
bogon = "0.3"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
keyring-core = "1.0.0"
secrecy = "0.10.3"
sha2 = "0.10.9"
audible_api = "0.1.0"

# Platform-native OS credential stores, registered directly through keyring-core
# (see remote_source/vault.rs). Replaces the `keyring` umbrella crate, whose
# unconditional `db-keystore` backend dragged in turso + tantivy + memmap2 (a
# SQLite rewrite and a full-text search engine) that ABB never used — it only
# ever selects the native OS keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Default features - now minimal with only essential Tauri features
default = []
binding-export = []
decoder-contract = []
bundled-ffmpeg = [
    "ffmpeg-next/build",
    "ffmpeg-sys-next/build-audiotoolbox",
]
bundled-ffmpeg-portable = [
    "bundled-ffmpeg",
    "ffmpeg-sys-next/build-portable",
]

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.11.5", features = ["test"] }
base64 = "0.22.1"
# Media-lane fixture synthesis (e.g. MP3 via libmp3lame). Same version as the
# main dependency, so this adds zero extra compilation.
ffmpeg-next = "9.0.0"

[lints]
workspace = true
