[package]
name = "audiobook-boss"
version = "1.15.0"
description = "AudioBook Boss™ — Batch audiobook processing and metadata management"
authors = ["JStar"]
edition = "2021"
default-run = "audiobook-boss"
autobins = false

[[bin]]
name = "audiobook-boss"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["binding-export"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiobook_boss_lib"
# Tauri packaging needs these crate types. Use one package/target-selected
# Nextest command at a time for Rust review instead of changing packaging
# artifacts to influence test discovery.
crate-type = ["staticlib", "cdylib", "rlib"]
# ABB treats backend contract coverage as unit/integration tests plus IPC and
# boundary checks; rustdoc examples are not a supported test surface today.
doctest = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
abb-engine = { path = "../crates/abb-engine" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.10"
tokio = { version = "1.52.1", features = ["sync", "time"] }
# Exact pins: a prerelease family whose generated TS contract can change between
# RCs. Bump together with the engine crate, deliberately, and regenerate bindings.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Default features - now minimal with only essential Tauri features
default = []
binding-export = []
bundled-ffmpeg = ["abb-engine/bundled-ffmpeg"]
bundled-ffmpeg-portable = ["abb-engine/bundled-ffmpeg-portable"]

[lints]
workspace = true
