<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiobook Boss</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>

  <body class="p-0">
    <script type="module" src="/src/main.ts"></script>

    <div class="main-container">
      <!-- Left: Input panel -->
      <div class="panel input-panel">
        <div class="flex flex-col gap-2 mb-2">
          <div class="flex items-center justify-between">
            <h3 class="section-title mb-0 whitespace-nowrap mr-2">
              Input and File Order
            </h3>

            <!-- Job Controls -->
            <div id="job-controls-root"></div>
          </div>

          <div id="file-import-root"></div>
        </div>

        <div
          class="section-divider file-properties-pinned inspector-footer"
          role="region"
          aria-label="Selected File Properties"
        >
          <!-- Context Anchor Header - prevents "what am I looking at?" confusion -->
          <div class="inspector-header">
            <span
              class="inspector-context"
              id="prop-selected-context"
              aria-live="polite"
            >
              <!-- Dynamic: shows filename + position OR empty state -->
              <span class="context-empty">No file selected</span>
            </span>
          </div>

          <div class="grid grid-cols-2 gap-x-3 gap-y-0.5 text-xs">
            <span class="property-label">Bitrate:</span
            ><span class="property-value" id="prop-bitrate">--- kb/s</span>
            <span class="property-label">Sample Rate:</span
            ><span class="property-value" id="prop-samplerate">--- Hz</span>
            <span class="property-label">Channels:</span
            ><span class="property-value" id="prop-channels">---</span>
            <span class="property-label">File Size:</span
            ><span class="property-value" id="prop-filesize">--- MB</span>
            <span class="property-label">Combined Size:</span
            ><span class="property-value" id="prop-combinedsize">--- MB</span>
          </div>
        </div>
      </div>

      <!-- Right: Metadata + Output + Status -->
      <div class="right-column-wrapper">
        <div class="panel metadata-output-panel">
          <div class="metadata-output-scroll">
            <!-- METADATA SECTION -->
            <div class="section-header">
              <h3>Metadata Manager</h3>
            </div>
            <div
              id="metadata-selection-count"
              class="text-xs muted-text mb-2"
              hidden
            ></div>
            <div id="metadata-form" data-multi-select="false">
            <div class="grid grid-cols-4 gap-3 mb-3">
              <div id="cover-art-root" class="col-span-1"></div>

              <!-- Metadata fields - compact -->
              <div id="metadata-form-fields-root" class="col-span-3"></div>
            </div>
            </div>

            <!-- AUDIO ENCODER SETTINGS SECTION -->
            <div id="encoder-panel-root"></div>
          </div>

          <div
            class="section-divider metadata-footer-pinned inspector-footer"
            role="region"
            aria-label="Output and preview"
          >
            <div id="output-panel-root"></div>

            <!-- PREVIEW AUDIO AND METADATA TAGS SECTION -->
            <div class="section-divider">
              <div class="section-header justify-between">
                <h3>Preview Audio and Metadata Tags</h3>
                <div class="split-button">
                  <button
                    id="preview-button"
                    class="btn-pill btn-pill-primary split-main"
                  >
                    Preview Audio
                  </button>
                  <button
                    id="preview-dropdown-toggle"
                    class="btn-pill btn-pill-primary split-caret"
                  >
                    ▼
                  </button>
                  <div id="preview-dropdown" class="split-dropdown">
                    <button class="split-option" data-duration="15">
                      15 seconds
                    </button>
                    <button class="split-option" data-duration="30">
                      30 seconds
                    </button>
                    <button class="split-option" data-duration="45">
                      45 seconds
                    </button>
                    <button class="split-option" data-duration="60">
                      60 seconds
                    </button>
                  </div>
                </div>
              </div>

              <div id="tag-preview-root"></div>

              <!-- Preview button moved to header -->
            </div>
            <!-- End of Preview Audio and Metadata Tags section -->
          </div>
          <!-- End of Output and preview footer -->
        </div>
        <!-- End of metadata-output-panel -->

        <!-- Status panel -->
        <div class="panel status-panel">
          <div class="status-panel-content">
            <div class="art-thumbnail">
              <span>Art</span>
            </div>
            <div class="progress-details">
              <div class="flex justify-between mb-0.5">
                <span class="text-xs"
                  >Progress:
                  <span class="property-value" id="hours-processed"
                    >--.-- / --.-- hours</span
                  >
                  →
                  <span class="property-value" id="percentage-processed"
                    >--%</span
                  ></span
                >
                <span id="status-text" class="text-xs font-semibold">Idle</span>
              </div>
              <div class="progress-bar-bg">
                <div
                  id="progress-bar"
                  class="progress-bar-fg"
                  style="width: 0%"
                ></div>
              </div>
              <div id="step-text" class="text-xs muted-text mt-0.5">
                Current Step: Waiting for files...
              </div>
              <div
                id="concurrency-status"
                class="text-xs muted-text mt-1"
              ></div>
              <div id="job-list" class="text-xs muted-text mt-1"></div>
              <div
                class="text-xs muted-text mt-1 flex items-center gap-2"
                style="display: none"
              >
                <!-- Moved Max Concurrent to Header -->
              </div>
            </div>
            <div class="flex gap-2">
              <button id="process-button" class="btn-pill btn-pill-primary">
                Process Audiobook
              </button>
              <button
                id="cancel-all-button"
                class="btn-pill btn-pill-secondary"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- End of right-column-wrapper -->
    </div>
    <!-- End of main-container -->
    <div id="metadata-lookup-root"></div>
  </body>
</html>
