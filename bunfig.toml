  "@solidjs/compiler-linux-arm64-gnu",
  "@solidjs/compiler-linux-x64-gnu",
  "@solidjs/compiler-wasm32-wasi",
  "@solidjs/compiler-win32-x64-msvc",
  "@solidjs/vite-plugin",
