[install]
# Delay fresh dependency resolutions by 10 days to reduce exposure to newly
# published supply-chain compromises while leaving the committed lockfile flow
# unchanged. Policy and exceptions live in docs/DECISIONS.md.
minimumReleaseAge = 864000

# Keep unrelated transitive resolutions gated during explicit prerelease updates.
minimumReleaseAgeExcludes = [
  "effect",
  "solid-js",
  "@solidjs/web",
  "@solidjs/babel-plugin",
  "@solidjs/compiler",
  "@solidjs/vite-plugin",
  "@solidjs/testing-library",
]
