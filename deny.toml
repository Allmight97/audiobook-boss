[licenses]
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0",
  "Unicode-3.0", "Unlicense", "WTFPL", "Zlib",
]
exceptions = [{ allow = ["LGPL-2.1-or-later"], crate = "faac-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "allow"
deny = [
  { crate = "url", deny-multiple-versions = true, reason = "cover-fetch SSRF policy types must be the url reqwest resolves" },
  { crate = "percent-encoding", deny-multiple-versions = true, reason = "cover path decoding uses the version url resolves" },
  { crate = "ffmpeg-sys-next", deny-multiple-versions = true, reason = "abb-ffmpeg is the one FFmpeg binding" },
  { crate = "reqwest", deny-multiple-versions = true, reason = "ABB has one HTTP stack; a second reqwest brings a second TLS stack" },
]
