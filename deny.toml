[graph]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib: unsound VariantStrIter only; GTK3 0.18 from tauri/wry/webkit2gtk on Linux; the fix is glib 0.20, which the GTK3 bindings do not get" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained; compile-time only, via gtk3-macros, glib-macros, and specta" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained; compile-time only, via gtk3-macros, glib-macros, and specta" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained only; zbus 5 via keepawake, secret-service, and the Linux keyring store; stays until they move to zbus 6, since dropping the keyring store loses saved Audible sign-ins on restart" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained only; zbus 5 via keepawake, secret-service, and the Linux keyring store; stays until they move to zbus 6, since dropping the keyring store loses saved Audible sign-ins on restart" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained only; zbus 5 via keepawake, secret-service, and the Linux keyring store; stays until they move to zbus 6, since dropping the keyring store loses saved Audible sign-ins on restart" },
]

[licenses]
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MIT-0", "MPL-2.0",
  "Unicode-3.0", "Unlicense", "WTFPL", "Zlib",
]
exceptions = [{ allow = ["LGPL-2.1-or-later"], crate = "faac-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "allow"
deny = [
  { crate = "url", deny-multiple-versions = true, reason = "cover-fetch SSRF policy types must be the url reqwest resolves" },
  { crate = "percent-encoding", deny-multiple-versions = true, reason = "cover path decoding uses the version url resolves" },
  { crate = "ffmpeg-sys-next", deny-multiple-versions = true, reason = "abb-ffmpeg is the one FFmpeg binding" },
  { crate = "reqwest", deny-multiple-versions = true, reason = "ABB has one HTTP stack; a second reqwest brings a second TLS stack" },
]
