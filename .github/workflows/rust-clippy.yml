name: Rust Clippy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  clippy:
    name: Clippy (${{ matrix.feature || 'default' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    strategy:
      fail-fast: false
      matrix:
        feature: ["", "safe-ffmpeg"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg + Clang dev libraries (feature-on)
        if: matrix.feature == 'safe-ffmpeg'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev \ 
            libavcodec-dev libavformat-dev libavutil-dev \ 
            libavfilter-dev libavdevice-dev libswresample-dev libswscale-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Show versions
        run: |
          rustc -Vv
          cargo -V

      - name: Run Clippy (default)
        if: matrix.feature == ''
        run: cargo clippy -- -D warnings

      - name: Run Clippy (safe-ffmpeg)
        if: matrix.feature == 'safe-ffmpeg'
        run: cargo clippy --features safe-ffmpeg -- -D warnings
