name: Perf (Manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Perf run mode
        required: true
        type: choice
        options:
          - synthetic
          - real
        default: synthetic
      bench_scope:
        description: Benchmark scope
        required: true
        type: choice
        options:
          - all
          - core3
          - single
        default: core3
      bench_name:
        description: Optional benchmark name (required for bench_scope=single)
        required: false
        default: ""
      runs:
        description: Number of runs per benchmark
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  perf:
    name: Manual Perf Run (non-blocking)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install FFmpeg and tools
        run: brew install ffmpeg pkg-config

      - name: Install dependencies
        run: bun install

      - name: Run performance suite (non-blocking)
        id: run_perf
        continue-on-error: true
        env:
          PERF_MODE: ${{ github.event.inputs.mode }}
          PERF_BENCH_SCOPE: ${{ github.event.inputs.bench_scope }}
          PERF_BENCH_NAME: ${{ github.event.inputs.bench_name }}
          PERF_RUNS: ${{ github.event.inputs.runs }}
        run: |
          set -euo pipefail

          mkdir -p scripts/perf/results

          if ! [[ "$PERF_RUNS" =~ ^[0-9]+$ ]] || [ "$PERF_RUNS" -lt 1 ]; then
            echo "Invalid runs input '$PERF_RUNS'; falling back to 5"
            PERF_RUNS=5
          fi

          args=(scripts/perf/run.mjs --mode "$PERF_MODE" --bench-scope "$PERF_BENCH_SCOPE" --runs "$PERF_RUNS" --compare-baseline --append-history)
          if [ -n "${PERF_BENCH_NAME:-}" ]; then
            args+=(--bench-name "$PERF_BENCH_NAME")
          fi

          echo "Running: bun ${args[*]}"
          bun "${args[@]}"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Perf Run Summary"
            echo
            echo "- Outcome: **${{ steps.run_perf.outcome }}**"
            echo "- Mode: \`${{ github.event.inputs.mode }}\`"
            echo "- Bench scope: \`${{ github.event.inputs.bench_scope }}\`"
            echo "- Bench name: \`${{ github.event.inputs.bench_name || 'n/a' }}\`"
            echo "- Runs: \`${{ github.event.inputs.runs }}\`"
            echo

            if [ "${{ github.event.inputs.bench_scope }}" = "single" ] && [ -z "${{ github.event.inputs.bench_name }}" ]; then
              echo "> Warning: \`bench_scope=single\` was selected without a \`bench_name\`."
              echo
            fi

            echo "### Result artifacts"
            echo
            if find scripts/perf/results -type f | grep -q .; then
              find scripts/perf/results -type f | sort | sed 's|^|- `|; s|$|`|'
            else
              echo "- No result files found in \`scripts/perf/results\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.run_id }}
          path: scripts/perf/results
          if-no-files-found: warn
          retention-days: 14
