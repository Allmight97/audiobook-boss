name: claude review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'auto' }}
  cancel-in-progress: true

jobs:
  size:
    name: Review size gate
    if: >-
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type == 'User' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      review: ${{ steps.size.outputs.review }}
    steps:
      - id: size
        env:
          ACTION: ${{ github.event.action }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if [ "${ACTION}" = labeled ] || [ $((ADDITIONS + DELETIONS)) -ge 300 ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: $((ADDITIONS + DELETIONS)) changed lines is under 300; add the claude-review label to review it."
          fi

  review:
    name: Claude review
    needs: size
    if: github.event.pull_request.draft != true && needs.size.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check subscription token is configured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN using claude setup-token, then gh secret set. See docs/claude-on-github.md."
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following REVIEW.md at the repository root.
            Post findings as inline comments and finish with one summary comment.
          # Pinned so reviews never fall back to the action's older default model.
          claude_args: |
            --model claude-fable-5-2 --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      # Text from the review is wrapped in stop-commands so it cannot issue workflow commands.
      - name: Fail when the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          posted="$(
            {
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
                --jq '.[] | select(.user.login == "claude[bot]") | .submitted_at'
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" \
                --jq '.[] | select(.user.login == "claude[bot]") | .created_at, .updated_at'
              gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                --jq '.[] | select(.user.login == "claude[bot]") | .created_at, .updated_at'
            } | awk -v since="${SINCE}" '$0 >= since' | wc -l
          )"
          if [ "${posted}" -gt 0 ]; then
            exit 0
          fi
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          if [ -f "${EXECUTION_FILE}" ]; then
            jq -r '.[] | select(.type == "result")
              | (.permission_denials[]? | "denied: \(.tool_name) \(.tool_input | tostring)"),
                "final message: \(.result // "")"' "${EXECUTION_FILE}"
          fi
          echo "::${token}::"
          echo "::error::The Claude review posted no review or comment on this PR."
          exit 1
