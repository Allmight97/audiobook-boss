name: release-publish

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether this push releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-tags: true
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-release.sh plan

  ci-gate:
    name: Wait for CI on this commit
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 4800))
          while true; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf '%s\n' "CI for ${SHA} did not succeed before the wait ended. Fix: rerun the ci workflow for that commit, then rerun this workflow." >&2
              exit 1
            fi
            state="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --workflow ci.yml --event push --limit 20 --json status,conclusion --jq 'if length == 0 then "missing" elif any(.[]; .status != "completed") then "wait" elif .[0].conclusion == "success" then "ok" else "fail" end')"
            case "$state" in
              ok)
                printf '%s\n' "CI for ${SHA} succeeded."
                exit 0
                ;;
              wait|missing)
                sleep 30
                ;;
              fail)
                printf '%s\n' "CI for ${SHA} did not succeed. Fix: make the ci workflow for that commit succeed, then rerun this workflow. This workflow will not publish." >&2
                exit 1
                ;;
              *)
                printf '%s\n' "Cannot read the ci run for ${SHA}." >&2
                exit 1
                ;;
            esac
          done

  publish:
    name: Publish GitHub release
    needs: [plan, ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true' && needs.ci-gate.result == 'success'
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep only the pinned Rust toolchain
        run: |
          rustup toolchain install
          pinned="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup default "$pinned"
          rustup toolchain list --quiet | while read -r toolchain; do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
          [ "$(rustup toolchain list --quiet)" = "$pinned" ]
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - run: bash scripts/setup.sh frontend
      - run: bun scripts/version-files.ts
      - run: bash scripts/setup.sh rust
      - id: toolchain
        run: echo "id=$( (cc --version; xcrun --show-sdk-version; pkg-config --modversion opus) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - run: touch "$RUNNER_TEMP/ffmpeg-job-start"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: ffmpeg
        with:
          path: target/abb-ffmpeg-cache
          key: ffmpeg-portable-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/ffmpeg-sys-next-*/**', 'vendor/opus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ffmpeg-portable-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/ffmpeg-sys-next-*/**', 'vendor/opus/**') }}-
            ffmpeg-portable-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-
      - run: bun run app:build:dmg
      - run: bun scripts/check-bundled-licenses.ts
      - id: dmg
        run: |
          dir="$RUNNER_TEMP/release-assets"
          version="$(bun scripts/version-files.ts --print)"
          bun scripts/resolve-release-dmg.ts --version "$version" --stage "$dir" > "$RUNNER_TEMP/release-stage.txt"
          while IFS= read -r line; do
            printf '%s\n' "$line"
            printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
            case "$line" in
              sha256=*) sha="${line#sha256=}" ;;
              asset=*) asset="${line#asset=}" ;;
            esac
          done < "$RUNNER_TEMP/release-stage.txt"
          printf 'dir=%s\n' "$dir" >> "$GITHUB_OUTPUT"
          {
            printf '### DMG\n\n'
            printf '%s\n\n' "$asset"
            printf 'SHA-256 %s\n' "$sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-release.sh create "$RUNNER_TEMP/release-assets"
      - id: ffmpeg-trees
        if: always()
        run: |
          for tree in target/abb-ffmpeg-cache/*/; do
            [ -d "$tree" ] || continue
            [ "$tree/abb-last-used" -nt "$RUNNER_TEMP/ffmpeg-job-start" ] || rm -rf "$tree"
          done
          compiled=$(find target/abb-ffmpeg-cache -path '*/dist/abb-build-inputs' -newer "$RUNNER_TEMP/ffmpeg-job-start" 2>/dev/null | wc -l | tr -d " ")
          echo "abb-ffmpeg-cache: compiled $compiled tree(s)"
          echo "compiled=$compiled" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always() && steps.ffmpeg-trees.outputs.compiled != '0' && steps.ffmpeg-trees.outputs.compiled != '' && steps.ffmpeg.outputs.cache-primary-key != ''
        with:
          path: target/abb-ffmpeg-cache
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - if: always()
        run: rm -rf target/abb-ffmpeg-cache
