name: ffmpeg upstream

on:
  schedule:
    - cron: "0 14 */2 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch:
    name: Keep the FFmpeg upstream issue current
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - run: bun run ffmpeg:upstream --issue
        env:
          GH_TOKEN: ${{ github.token }}
