name: ffmpeg release check

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Check whether an FFmpeg release contains the pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - run: bun run ffmpeg:upstream --release-check 669
        env:
          GH_TOKEN: ${{ github.token }}
