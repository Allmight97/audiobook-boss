name: rust core crates

# The core crates stay independent of FFmpeg. The macOS job proves the
# engine's rules, its Save golden paths, and its host-API examples against
# ABB's patched bundled FFmpeg; the Linux media job encodes real audio through
# the same build. Apple AAC workflow proof stays local.

on:
  pull_request:
    paths:
      - .github/workflows/rust-core.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/check-rust-tiers.sh
      - scripts/setup-linux-agent.sh
      - vendor/**
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-core.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/check-rust-tiers.sh
      - scripts/setup-linux-agent.sh
      - vendor/**
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CORE_CRATES: >-
    -p abb-audible-core -p abb-media-core -p abb-metadata-core
    -p abb-output-artifact-core -p abb-processing-core -p abb-remote-source-core

jobs:
  core:
    name: Core crate tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: bash scripts/check-rust-tiers.sh
      - run: cargo test --locked $CORE_CRATES
      - run: cargo clippy --locked $CORE_CRATES --all-targets -- -D warnings

  engine:
    name: Engine lifecycle tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: brew install opus pkg-config nasm
      # The Linux media job runs these two; they need an FFmpeg 9 CLI.
      - run: >-
          cargo test --locked -p abb-engine --features bundled-ffmpeg --lib --
          --skip test_cases::integration_media
          --skip save_updates_finished_outputs_in_every_supported_container
      # The engine's host-API examples guard which internals hosts can reach.
      - run: cargo test --locked -p abb-engine --features bundled-ffmpeg --doc

  media:
    name: Engine media lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: bash scripts/setup-linux-agent.sh --rust
      - run: >-
          ABB_FFMPEG="$HOME/.local/bin/ffmpeg" ABB_FFPROBE="$HOME/.local/bin/ffprobe"
          cargo test --locked -p abb-engine --features bundled-ffmpeg --lib --
          test_cases::integration_media
          save_updates_finished_outputs_in_every_supported_container
