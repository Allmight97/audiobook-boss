name: rust core crates

# The core crates stay independent of FFmpeg. A separate macOS job proves
# engine lifecycle rules against ABB's patched bundled FFmpeg; real-media
# and Apple AAC workflow proof remains in the local media lane.

on:
  pull_request:
    paths:
      - .github/workflows/rust-core.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/check-rust-tiers.sh
  push:
    branches: [main, engine-prepare]
    paths:
      - .github/workflows/rust-core.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/check-rust-tiers.sh
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CORE_CRATES: >-
    -p abb-audible-core -p abb-media-core -p abb-metadata-core
    -p abb-output-artifact-core -p abb-processing-core -p abb-remote-source-core

jobs:
  core:
    name: Core crate tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: bash scripts/check-rust-tiers.sh
      - run: cargo test --locked $CORE_CRATES
      - run: cargo clippy --locked $CORE_CRATES --all-targets -- -D warnings

  engine:
    name: Engine lifecycle tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: brew install opus pkg-config nasm
      - run: cargo test --locked -p abb-engine --features bundled-ffmpeg --lib -- --skip test_cases::integration
