name: rust core crates

# Tests and lints the pure abb-*-core crates on a clean runner. They build
# without Tauri, GUI libraries or FFmpeg, so this stays fast. The src-tauri
# runtime suite and generated-binding checks remain local (scripts/AGENTS.md).

on:
  pull_request:
    paths:
      - .github/workflows/rust-core.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-core.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CORE_CRATES: >-
    -p abb-audible-core -p abb-media-core -p abb-metadata-core
    -p abb-output-artifact-core -p abb-processing-core -p abb-remote-source-core

jobs:
  core:
    name: Core crate tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: cargo test --locked $CORE_CRATES
      - run: cargo clippy --locked $CORE_CRATES --all-targets -- -D warnings
