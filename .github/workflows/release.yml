name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish macOS Release
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install build dependencies
        run: brew install ffmpeg pkg-config

      - name: Install JS dependencies
        run: bun ci

      - name: Validate tag, version, and changelog alignment
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Release tags must start with 'v'." >&2
            exit 1
          fi

          package_version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)"
          tauri_version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"

          for current in "$package_version" "$tauri_version" "$cargo_version"; do
            if [[ "$current" != "$version" ]]; then
              echo "Tag version $version does not match repo version surfaces." >&2
              echo "package.json=$package_version" >&2
              echo "src-tauri/tauri.conf.json=$tauri_version" >&2
              echo "src-tauri/Cargo.toml=$cargo_version" >&2
              exit 1
            fi
          done

          ./scripts/extract-release-notes.sh --version "$version" --output release-notes.md

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=AudioBook Boss v$version" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: bun run app:build:dmg

      - name: Resolve tagged DMG artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(bun scripts/resolve-release-dmg.ts --version "${{ steps.meta.outputs.version }}")"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          title="${{ steps.meta.outputs.title }}"
          dmg_path="${{ steps.artifact.outputs.dmg_path }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag already exists and is published; cannot upload assets to an immutable release." >&2
              exit 1
            fi
            gh release edit "$tag" \
              --title "$title" \
              --notes-file release-notes.md \
              --draft
          else
            gh release create "$tag" \
              --title "$title" \
              --notes-file release-notes.md \
              --draft
          fi

          gh release upload "$tag" "$dmg_path" --clobber
          gh release edit "$tag" --draft=false --latest
