# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tests/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'scripts/**'
      - '!docs/**'  # Explicitly ignore docs to prevent triggers on doc-only changes
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tests/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'scripts/**'
      - '!docs/**'  # Explicitly ignore docs to prevent triggers on doc-only changes
      - '.github/workflows/ci.yml'

jobs:
  quality-gate:
    runs-on: macos-latest  # macOS for ffmpeg/tauri compat
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      
      - name: Install FFmpeg and Tools
        run: brew install ffmpeg pkg-config ripgrep
      
      - name: Install dependencies
        run: bun install
        
      - name: Rust Format Check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Contract Verification
        run: chmod +x scripts/ensure-contract.sh && ./scripts/ensure-contract.sh

      - name: TypeScript Typecheck
        run: bunx tsc -p tsconfig.json --noEmit
        
      - name: Rust Tests
        run: cd src-tauri && cargo test
        
      - name: TypeScript Tests
        run: bun run test
        
      - name: Module Size Check (informational)
        run: python3 scripts/analyze_code_lines.py
        continue-on-error: true