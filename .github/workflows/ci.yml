# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tests/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tests/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  quality-gate:
    runs-on: macos-latest  # macOS for ffmpeg/tauri compat
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      
      - name: Install FFmpeg
        run: brew install ffmpeg pkg-config
      
      - name: Install dependencies
        run: bun install
        
      - name: Quick Checks (fmt, clippy, contracts, tsc)
        run: ./scripts/quick-checks.sh
        
      - name: Rust Tests
        run: cd src-tauri && cargo test
        
      - name: TypeScript Tests
        run: bun run test
        
      - name: Module Size Check (informational)
        run: python3 scripts/analyze_code_lines.py
        continue-on-error: true