# .github/workflows/ci.yml
name: CI

on:
  # Local-first mode: disable automatic remote CI for PRs.
  # Keep manual dispatch available for one-off verification when needed.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Fast check to determine if code actually changed (second-line defense for PRs)
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for push event diffs
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/src/**'
              - 'src-tauri/tests/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - '.prettierrc'
              - '.prettierignore'
              - 'mise.toml'
              - 'rust-toolchain.toml'
              - '.githooks/**'
              - '.git-blame-ignore-revs'
              - 'scripts/**'
              - '.cargo/**'
              - '.github/workflows/ci.yml'

  quality-gate:
    needs: changes
    # All PRs with code changes + fail-open when filter fails
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' || needs.changes.result == 'failure'
    runs-on: macos-latest  # macOS for ffmpeg/tauri compat
    steps:
      - uses: actions/checkout@v6
      # Keep in sync with rust-toolchain.toml channel
      - uses: dtolnay/rust-toolchain@1.93
      - uses: jdx/mise-action@v3
        with:
          install: true
      
      - name: Install FFmpeg and Tools
        run: brew install ffmpeg pkg-config ripgrep
      
      - name: Install dependencies
        run: bun install

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v0.22.1

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Verify cargo-audit
        run: cargo audit --version

      - name: Standard Checks (primary gate)
        run: scripts/checks.sh standard

      - name: Coverage threshold check
        run: bun run test:coverage

      - name: Module Size Check (informational)
        run: python3 scripts/analyze_code_lines.py
        continue-on-error: true
