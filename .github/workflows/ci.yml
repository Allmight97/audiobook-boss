# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: macos-latest  # macOS for ffmpeg/tauri compat
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install
        
      - name: Quick Checks (fmt, clippy, contracts, tsc)
        run: ./scripts/quick-checks.sh
        
      - name: Rust Tests
        run: cd src-tauri && cargo test
        
      - name: TypeScript Tests
        run: bun run test
        
      - name: Module Size Check (informational)
        run: python3 scripts/analyze_code_lines.py
        continue-on-error: true