name: ci

# CI runs when a PR opens ready or is marked ready, when auto-merge is enabled
# (the merge attempt), by hand, and twice a week on main. Pushes start nothing,
# and drafts never run. The `gate` job is the check main requires: a push after
# the last run leaves the new head without one, so the merge waits for a new
# run. Within a PR run, each job proves only what the PR changed; manual and
# scheduled runs prove everything, and also run `cargo audit` and `cargo deny`
# (`supply-chain`). The scheduled run keeps the FFmpeg cache
# alive, because GitHub evicts caches unused for 7 days and only runs on main
# save caches that PRs can restore.
#
# Check commands live in scripts/verify.sh. This file only selects lanes.

on:
  pull_request:
    types: [opened, ready_for_review, auto_merge_enabled]
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ github.event_name != 'pull_request' }}
      frontend: ${{ steps.filter.outputs.frontend }}
      core: ${{ steps.filter.outputs.core }}
      engine: ${{ steps.filter.outputs.engine }}
      media: ${{ steps.filter.outputs.media }}
      host: ${{ steps.filter.outputs.host }}
      decrypt: ${{ steps.filter.outputs.decrypt }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - .github/workflows/ci.yml
              - src/**
              - package.json
              - bun.lock
              - bunfig.toml
              - tsconfig.json
              - vite.config.ts
              - vitest.config.ts
              - biome.json
              - knip.json
              - .node-version
              - scripts/**/*.ts
              - scripts/locked-bun-version.sh
              - scripts/setup.sh
              - scripts/verify.sh
            shared: &shared
              - .github/workflows/ci.yml
              - Cargo.toml
              - Cargo.lock
              - crates/*/Cargo.toml
              - src-tauri/Cargo.toml
              - rust-toolchain.toml
              - vendor/**
              - scripts/setup.sh
              - scripts/verify.sh
            core:
              - *shared
              - scripts/check-rust-tiers.sh
              - scripts/check-rust-complexity.sh
              - scripts/rust-complexity-allowlist.txt
              - crates/*/src/**
              - src-tauri/src/**
              - crates/abb-*-core/**
            engine:
              - *shared
              - crates/**
            media:
              - *shared
              - crates/abb-media-core/**
              - crates/abb-metadata-core/**
              - crates/abb-output-artifact-core/**
              - crates/abb-processing-core/**
              - crates/abb-engine/src/audio/**
              - crates/abb-engine/src/metadata/**
              - crates/abb-engine/src/output_artifact/**
              - crates/abb-engine/src/processing/**
              - crates/abb-engine/src/test_cases/integration_media*
            host:
              - *shared
              - crates/**
              - src-tauri/**
              - src/lib/generated/**
              - scripts/check-generated-bindings.sh
            decrypt:
              - *shared
              - tools/abb-aaxclean-helper/**
              - scripts/publish-aaxclean-helper.ts
              - crates/abb-engine/src/remote_source/**
              - crates/abb-engine/src/test_cases/integration_decrypt*
            tooling:
              - .github/workflows/**
              - scripts/*.sh
              - .claude/hooks/**


  frontend:
    name: Frontend typecheck and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bash scripts/setup.sh frontend
      - run: bash scripts/verify.sh frontend

  core:
    name: Core crate tests and clippy
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.10
          enable-cache: false
      - run: bash scripts/verify.sh core

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    # `core` starts the matrix so macOS still gates fmt and core Clippy.
    # Ubuntu rust then skips the core lane; the dedicated core job already ran it.
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.engine == 'true'
      || needs.changes.outputs.host == 'true' || needs.changes.outputs.media == 'true'
      || needs.changes.outputs.decrypt == 'true' || needs.changes.outputs.all == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ALL: ${{ needs.changes.outputs.all }}
      CORE: ${{ needs.changes.outputs.core }}
      ENGINE: ${{ needs.changes.outputs.engine }}
      MEDIA: ${{ needs.changes.outputs.media }}
      HOST: ${{ needs.changes.outputs.host }}
      DECRYPT: ${{ needs.changes.outputs.decrypt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tools/abb-aaxclean-helper/**/*.csproj', 'tools/abb-aaxclean-helper/global.json', 'tools/abb-aaxclean-helper/Directory.Build.props') }}
      - run: bash scripts/setup.sh rust
      - if: env.HOST == 'true' || env.ALL == 'true'
        run: bash scripts/setup.sh frontend
      - id: toolchain
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            echo "id=$( (cc --version; xcrun --show-sdk-version; pkg-config --modversion opus) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "id=$( (cc --version; pkg-config --modversion opus) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      # The build script reuses FFmpeg only while compiler, opus, source and
      # patch match, so the key carries the same inputs. `portable` so a
      # native-built cache cannot restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/build/ffmpeg-sys-next-*/out
          key: ffmpeg-portable-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/ffmpeg-sys-next-*/**', 'rust-toolchain.toml') }}
      - run: |
          lanes=()
          # Dedicated Ubuntu `core` job already ran fmt, core Clippy, and tests.
          # macOS runs that lane here so those checks still gate on a Mac.
          if [ "${RUNNER_OS}" = macOS ] && { [ "${CORE}" = true ] || [ "${ALL}" = true ]; }; then
            lanes+=(core)
          fi
          if [ "${ENGINE}" = true ] || [ "${ALL}" = true ]; then
            lanes+=(engine)
          fi
          if [ "${MEDIA}" = true ] || [ "${ALL}" = true ]; then
            lanes+=(media)
          fi
          if [ "${HOST}" = true ] || [ "${ALL}" = true ]; then
            lanes+=(host)
          fi
          if [ "${DECRYPT}" = true ] || [ "${ALL}" = true ]; then
            lanes+=(decrypt)
          fi
          if [ "${RUNNER_OS}" = macOS ]; then
            lanes+=(apple)
          fi
          if [ "${#lanes[@]}" -eq 0 ]; then
            echo "No rust lanes selected for this OS"
            exit 0
          fi
          bash scripts/verify.sh "${lanes[@]}"

  tooling:
    name: Workflows and shell
    needs: changes
    if: needs.changes.outputs.tooling == 'true' || needs.changes.outputs.all == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - run: bash scripts/verify.sh tooling

  supply-chain:
    name: Advisories and licenses
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2
      - run: cargo audit -D warnings
      - run: cargo deny check licenses sources

  gate:
    name: gate
    needs: [changes, frontend, core, rust, tooling, supply-chain]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every job that ran passed."
