# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      # Code paths that should trigger CI
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tests/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      # Explicit exclusions (first-line defense)
      - '!docs/**'
      - '!.codex/**'
      - '!.claude/**'
      - '!.agent/**'
      - '!**/*.md'
      - '!**/.DS_Store'
  push:
    branches: [main]
    paths:
      # Code paths that should trigger CI
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tests/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      # Explicit exclusions (first-line defense)
      - '!docs/**'
      - '!.codex/**'
      - '!.claude/**'
      - '!.agent/**'
      - '!**/*.md'
      - '!**/.DS_Store'

permissions:
  contents: read
  pull-requests: read

jobs:
  # Fast check to determine if code actually changed (second-line defense for PRs)
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for push event diffs
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/src/**'
              - 'src-tauri/tests/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'package.json'
              - 'bun.lockb'
              - 'tsconfig.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  quality-gate:
    needs: changes
    # Fail-open: run if code changed OR if detection failed (don't skip CI on filter errors)
    if: needs.changes.outputs.code == 'true' || needs.changes.result == 'failure'
    runs-on: macos-latest  # macOS for ffmpeg/tauri compat
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      
      - name: Install FFmpeg and Tools
        run: brew install ffmpeg pkg-config ripgrep
      
      - name: Install dependencies
        run: bun install
        
      - name: Standard Checks (tiered)
        run: scripts/standard-checks.sh

      - name: TypeScript Tests
        run: bun run test
        
      - name: Module Size Check (informational)
        run: python3 scripts/analyze_code_lines.py
        continue-on-error: true