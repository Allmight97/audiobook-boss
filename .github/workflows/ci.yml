name: ci

# Policy facts live in this file; scripts/check-pr-workflow-policy.ts enforces them.
# Why this shape: docs/DECISIONS.md.
# The daily cron refreshes advisories. Monday and Thursday prove every lane so
# caches stay used. A merged PR proves main, then deletes that PR's caches.
# scripts/verification.ts selects jobs; verify.sh owns commands.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: "0 6 * * *"
    - cron: "30 6 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: github.event.pull_request.draft != true && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      core: ${{ steps.plan.outputs.core }}
      tooling: ${{ steps.plan.outputs.tooling }}
      supply_chain: ${{ steps.plan.outputs.supply_chain }}
      rust_needed: ${{ steps.plan.outputs.rust_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - id: plan
        env:
          BASE: ${{ github.event.action != 'closed' && github.event.pull_request.base.sha || '' }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = "0 6 * * *" ]; then
            bun scripts/verification.ts plan --advisories
          elif [ -n "$BASE" ]; then
            bun scripts/verification.ts plan "$BASE"
          else
            bun scripts/verification.ts plan
          fi

  frontend:
    name: Frontend typecheck and tests
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bash scripts/setup.sh frontend
      - run: bash scripts/verify.sh frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: proof-frontend
          path: .logs/verification
          include-hidden-files: true
          retention-days: 14

  core:
    name: Core crate tests and clippy
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.10
          enable-cache: false
      - run: bash scripts/verify.sh core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: proof-core
          path: .logs/verification
          include-hidden-files: true
          retention-days: 14

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.rust_needed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tools/abb-aaxclean-helper/**/*.csproj', 'tools/abb-aaxclean-helper/global.json', 'tools/abb-aaxclean-helper/Directory.Build.props') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - run: bash scripts/setup.sh frontend
      - if: matrix.native
        run: bash scripts/setup.sh rust
      - id: toolchain
        if: matrix.native
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            echo "id=$( (cc --version; xcrun --show-sdk-version; pkg-config --modversion opus) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "id=$( (cc --version; pkg-config --modversion opus) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      # Cached compilation is reusable even when a behavioral check fails.
      # FFmpeg's build owner validates each restored tree's effective inputs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg
        if: matrix.native
        with:
          path: target/abb-ffmpeg-cache
          key: ffmpeg-portable-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/ffmpeg-sys-next-*/**', 'vendor/opus/**') }}
          restore-keys: ffmpeg-portable-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-
      - env:
          LANES: ${{ join(matrix.lanes, ' ') }}
        run: |
          read -r -a lanes <<< "$LANES"
          bash scripts/verify.sh "${lanes[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && matrix.native && steps.ffmpeg.outputs.cache-hit != 'true' && steps.ffmpeg.outputs.cache-primary-key != '' && hashFiles('target/abb-ffmpeg-cache/**/abb-build-inputs') != ''
        with:
          path: target/abb-ffmpeg-cache
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: proof-${{ matrix.os }}
          path: |
            .logs/verification
            .logs/verify
          include-hidden-files: true
          retention-days: 14

  tooling:
    name: Workflows and shell
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.tooling == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - run: bash scripts/verify.sh tooling
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: proof-tooling
          path: .logs/verification
          include-hidden-files: true
          retention-days: 14

  supply-chain:
    name: Advisories and licenses
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2
      - run: bash scripts/verify.sh supply-chain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: proof-supply-chain
          path: .logs/verification
          include-hidden-files: true
          retention-days: 14

  gate:
    name: gate
    needs: [changes, frontend, core, rust, tooling, supply-chain]
    if: always() && github.event.pull_request.draft != true && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: bash scripts/setup.sh frontend
      - env:
          VERIFY_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/verification.ts gate

  cache-cleanup:
    name: Delete closed PR caches
    needs: gate
    if: always() && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
      HEAD_REF: refs/heads/${{ github.head_ref }}
    steps:
      - run: |
          for ref in "$PR_REF" "$HEAD_REF"; do
            gh cache delete --all --ref "$ref" --succeed-on-no-caches --repo "$GITHUB_REPOSITORY"
          done
