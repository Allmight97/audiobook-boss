# .github/copilot-setup-steps.yml
# Pre-installs dependencies in Copilot coding agent's ephemeral environment.
#
# DX & AGENT IMPACT:
# ==================
# WITHOUT this file:
#   - Copilot discovers dependencies via trial-and-error (non-deterministic)
#   - Each cold start: ~3-5 min for ffmpeg + Rust toolchain + bun install
#   - May fail to find ffmpeg or use wrong version
#   - Agent may produce PRs that work locally but fail in CI
#
# WITH this file:
#   - Dependencies pre-installed before agent starts working
#   - Cold start reduced to ~1-2 min (workflow runs before agent code)
#   - Consistent ffmpeg version matching CI (brew install)
#   - Agent can immediately run `cargo test`, `bun run build`, lint checks
#   - Higher confidence PRs will pass CI on first attempt
#
# PRACTICAL VALUE:
#   - Faster iteration cycles when assigning issues to Copilot
#   - Fewer "works on my machine" failures
#   - Agent can validate its own changes before creating PR
#
# NOTE: This file uses GitHub Actions syntax but runs in Copilot's
# ephemeral environment, not standard CI. Copilot pre-runs these
# steps before the agent begins working on the assigned task.

name: "Copilot Setup"

steps:
  # Rust toolchain (required for cargo build/test/clippy)
  - name: Install Rust toolchain
    uses: dtolnay/rust-toolchain@stable

  # Bun package manager (required for frontend build/test)
  - name: Install Bun
    uses: oven-sh/setup-bun@v2

  # System dependencies for ffmpeg-next crate
  # macOS: brew is available in Copilot's environment
  # TODO: Add Linux support if Copilot environment changes
  - name: Install FFmpeg and build tools
    run: |
      if command -v brew &> /dev/null; then
        brew install ffmpeg pkg-config
      elif command -v apt-get &> /dev/null; then
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev pkg-config
      fi

  # Frontend dependencies (node_modules equivalent)
  - name: Install frontend dependencies
    run: bun install

  # Pre-compile Rust dependencies (optional but speeds up first build)
  # Commented out: adds ~2 min but saves time on first cargo test/build
  # - name: Pre-build Rust dependencies
  #   working-directory: src-tauri
  #   run: cargo build --release

  # Verify environment is ready (optional sanity check)
  - name: Verify setup
    run: |
      echo "=== Environment Verification ==="
      echo "Rust: $(rustc --version)"
      echo "Cargo: $(cargo --version)"
      echo "Bun: $(bun --version)"
      echo "FFmpeg: $(ffmpeg -version | head -1)"
      echo "pkg-config: $(pkg-config --version)"
      echo "=== Ready for Copilot agent ==="
