version: 2
updates:
  # Maintain Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
      day: "monday"
    # Senior Dev Tip: Use "chore" prefix so these don't clutter your "Feature" history
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Tag them so you can filter PRs easily
    labels:
      - "dependencies"
      - "rust"
    # Assign yourself so it shows in your "Review Requests" dashboard
    reviewers:
      - "Allmight97"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Maintain Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly" # Sync with Rust: Do all maintenance on the same day
      day: "monday"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    reviewers:
      - "Allmight97"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Maintain CI/CD actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github_actions"
    reviewers:
      - "Allmight97"
    groups:
      github-actions:
        patterns:
          - "*"


# The "Bun Catch" (Frontend Updates)
# WARNING
# Dependabot cannot update bun.lock yet.
# When you see a PR for a frontend dependency (e.g. react):
# - Check out the PR branch locally (gh pr checkout <number>).
# - Run bun install to update the lockfile.