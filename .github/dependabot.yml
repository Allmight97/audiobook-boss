version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 3
    groups:
      compatible-bun:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 3
    groups:
      compatible-cargo:
        update-types:
          - "patch"
          - "minor"
